# サイトの基本設定
baseURL: "https://numa-meta.com/" # サイトの公開URL（重要：必ず完全なURLにしてください）
title: "NUMA 全日本大学メタバース連盟"
copyright: "© [NUMA 全日本大学メタバース連盟](https://numa-meta.com/)"
theme: PaperMod
defaultContentLanguage: ja
images: ["images/og-cover.png"]

# Hugoのビルド設定
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
mainsections: ["posts"]

# キャッシュ設定
caches:
  images:
    dir: :cacheDir/images

# 出力コンテンツの最適化設定
minify:
  disableXML: true

# ページネーション設定
pagination:
  pagerSize: 5

# 言語設定
languages:
  ja:
    label: "日本語"
    weight: 1
    title: "NUMA 全日本大学メタバース連盟"
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: "About Us"
          url: /aboutus
          weight: 1
        - name: "加盟団体"
          url: /members
          weight: 2
        - name: "協賛・パートナー"
          url: /with-us
          weight: 3
        - name: "記事一覧"
          url: /posts
          weight: 5

# 出力フォーマット
outputs:
  home:
    - HTML
    - RSS
    - JSON

# テーマ（PaperMod）のパラメータ設定
params:
  env: production
  description: "NUMA 全日本大学メタバース連盟 (Nippon Universities Metaverse Alliance) の公式サイトです。NUMAは、XR・メタバース学生団体の互助組織です。大学や地域を越え、知見の共有や交流、共同制作やイベント運営に取り組んでいます。"
  author: "NUMA 全日本大学メタバース連盟"

  # --- 表示と機能の切り替え ---
  defaultTheme: "light" # "auto", "light", "dark" から選択
  disableThemeToggle: true # trueにするとテーマ切り替えボタンを非表示
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  # --- ホームページの設定 ---
  homeInfoParams:
    Title: ""
    Content: |
      ![NUMA 全日本大学メタバース連盟](/images/og-cover.png)

      **NUMA 全日本大学メタバース連盟** は、XR・メタバース学生団体の互助組織です🤝  
      大学や地域を越え、知見の共有や交流、共同制作やイベント運営に取り組んでいます✨  
      → [もっとNUMAを知る 【About Us】](/aboutus)

      **News** 📰  
      2026年10月10日・11日 [全国学生VRサークル活動報告大会 & XR制作物プレゼン 2026](https://vrsc-2026.numa-meta.com/) 開催

  socialIcons:
    - name: x
      url: "https://x.com/numa_meta_"
    - name: Discord
      url: "https://discord.gg/ZT32sdk6rv"


  # --- アセット（CSS, faviconなど）の設定 ---
  assets:
    customCSS: ["css/home-info.css"]
    favicon: "favicon/favicon.ico"
    disableHLJS: true # PaperMod内蔵のハイライトJSを無効化（Hugo標準のハイライト機能を使うため）

# Markdownのレンダリング設定
markup:
  goldmark:
    renderer:
      unsafe: true # Markdown内でHTMLタグを許可する
  highlight:
    noClasses: false # シンタックスハイライトにCSSクラスを使用する（Hugoの標準的な方法）

# 外部サービス連携の設定（必要に応じてコメントを外す）
# services:
#   instagram:
#     disableInlineCSS: true
#   twitter: # x.com へのエイリアス
#     disableInlineCSS: true
